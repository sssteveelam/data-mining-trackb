services:
  backend:
    build:
      context: ./backend
    environment:
      ARTIFACT_DIR: /app/artifacts
      REVIEW_THRESHOLD: "0.60"
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost}
    volumes:
      - ./artifacts:/app/artifacts:ro
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    restart: unless-stopped
